<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a12">
  <title>TT Scroll — Oyun Akışı</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="splash">
    <div class="splash-emojis" aria-hidden="true">
      <span style="--d:0s;--x:8%">🐤</span><span style="--d:1.2s;--x:78%">🍉</span>
      <span style="--d:2.4s;--x:22%">🎹</span><span style="--d:0.6s;--x:60%">🔪</span>
      <span style="--d:1.8s;--x:88%">🐍</span><span style="--d:3s;--x:40%">🏀</span>
      <span style="--d:2.1s;--x:14%">⛏️</span><span style="--d:0.9s;--x:68%">🏓</span>
    </div>
    <h1 class="logo">TT<span>SCROLL</span></h1>
    <p class="tagline">Kaydır · Oyna · Rekor Kır</p>
    <div class="splash-badge">🎮 22 mini oyun seni bekliyor</div>
    <button id="start-btn">KAYDIRMAYA BAŞLA 🚀</button>
    <div class="splash-ver">v1.3</div>
  </div>
  <div class="top-buttons">
    <button id="music-btn" title="Müzik aç/kapat">🎵</button>
    <button id="settings-btn" title="Ayarlar">⚙️</button>
  </div>
  <div id="feed" class="feed"></div>
  <div id="hint" class="scroll-hint">Yukarı kaydır <span class="arrow">⌃</span></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
